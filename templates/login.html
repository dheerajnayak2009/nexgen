<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap');

        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --accent: #f59e0b;
            --accent-light: #fbbf24;
            --gradient-2: linear-gradient(135deg, #1e1b4b 0%, #312e81 40%, #4f46e5 100%);
            --shadow-xl: 0 20px 50px rgba(0, 0, 0, 0.25), 0 8px 20px rgba(0, 0, 0, 0.15);
            --radius-lg: 20px;
            --radius-sm: 8px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lexend', 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            background: var(--gradient-2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        /* Ambient glow orbs */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            top: -180px;
            right: -120px;
            animation: floatBubble 8s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -120px;
            left: -100px;
            animation: floatBubble 10s ease-in-out infinite reverse;
        }

        @keyframes floatBubble {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(30px, -20px) scale(1.05);
            }
            50% {
                transform: translate(-15px, 25px) scale(0.95);
            }
            75% {
                transform: translate(-25px, -10px) scale(1.03);
            }
        }

        /* ========== LOGIN CARD ========== */
        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 24px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: var(--radius-lg);
            padding: 48px 36px 40px;
            box-shadow: var(--shadow-xl);
            text-align: center;
            color: #fff;
        }

        /* Logo / Brand */
        .login-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .login-logo-icon {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 900;
            color: #fff;
            /* box-shadow: 0 4px 15px rgba(245, 158, 11, 0.45); */
            /* If logo.png available, replace with: */
            background: url("{{ url_for('static', filename='logo.png') }}") center center;
            background-size: contain;
            background-repeat: no-repeat;
        }

        .login-brand span {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #fff;
        }

        .login-subtitle {
            font-size: 0.88rem;
            color: rgba(255, 255, 255, 0.65);
            margin-bottom: 32px;
            letter-spacing: 0.3px;
        }

        /* ========== FORM ========== */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.4px;
            margin-bottom: 6px;
            color: rgba(255, 255, 255, 0.85);
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            font-size: 1.1rem;
            pointer-events: none;
            opacity: 0.7;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border-radius: 50px;
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 0.95rem;
            font-family: 'Lexend', 'Inter', sans-serif;
            outline: none;
            transition: var(--transition);
            letter-spacing: 0.3px;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .form-group input:focus {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.13);
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.12);
        }

        /* ========== BUTTON ========== */
        .btn-login {
            width: 100%;
            padding: 14px;
            border-radius: 50px;
            border: none;
            background: var(--accent);
            color: #1e1b4b;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Lexend', 'Inter', sans-serif;
            cursor: pointer;
            letter-spacing: 0.3px;
            transition: var(--transition);
            box-shadow: 0 8px 30px rgba(245, 158, 11, 0.4);
            margin-top: 8px;
        }

        .btn-login:hover {
            background: var(--accent-light);
            transform: translateY(-2px);
            box-shadow: 0 14px 40px rgba(245, 158, 11, 0.5);
        }

        .btn-login:active {
            transform: translateY(0);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
        }

        /* ========== FOOTER LINKS ========== */
        .login-footer {
            margin-top: 24px;
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.55);
        }

        .login-footer a {
            color: var(--accent-light);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .login-footer a:hover {
            color: #fff;
            text-decoration: underline;
        }

        .login-footer span {
            margin: 0 6px;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 480px) {
            .login-card {
                padding: 36px 22px 30px;
            }
            .login-brand span {
                font-size: 1.2rem;
            }
            .form-group input {
                padding: 12px 14px 12px 40px;
                font-size: 0.9rem;
            }
            .btn-login {
                padding: 13px;
                font-size: 0.95rem;
            }
        }
        .error-text {
            color: #ff6b6b;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">

            <!-- Brand -->
            <div class="login-brand">
                <div class="login-logo-icon"></div>
                <span>NexGen Academy</span>
            </div>
            <p class="login-subtitle {% if error %}error-text{% endif %}">
                {{ error if error else "Log in to your dashboard" }}
            </p>

            <!-- Login Form -->
            <form method="POST" action="/login">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrap">
                        <span class="input-icon">👤</span>
                        <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" class="btn-login">Login</button>
            </form>

            <!-- Footer links -->
            <div class="login-footer">
                <a href="#">Forgot password?</a>
                <span>|</span>
                <a href="#">Create account</a>
            </div>
        </div>
    </div>

</body>
</html>
